<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>ATM取款机 - 转账</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/bg.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/view.css') }}"
    />
  </head>
  <body>
    <div id="container">
      <h1>转账</h1>
      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %} {% if success %}
      <p class="success">{{ success }}</p>
      {% endif %}
      <form method="POST" id="transfer-form">
        <div class="form-group">
          <label for="target_card">收款人卡号:</label>
          <input type="text" id="target_card" name="target_card" required />
        </div>

        <div class="form-group">
          <label for="confirm_name">收款人姓名:</label>
          <input type="text" id="confirm_name" name="confirm_name" required />
        </div>

        <div class="form-group">
          <label for="amount">转账金额 (¥):</label>
          <input
            type="text"
            id="amount"
            name="amount"
            step="0.01"
            min="0.01"
            required
          />
        </div>

        <button type="submit">确认转账</button>
        <a href="{{ url_for('menu') }}" class="back-link">返回主菜单</a>
      </form>
    </div>
  </body>
</html>
