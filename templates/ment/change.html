<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atm取款机 - 修改密码</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/bg.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/view.css')}}"
    />
  </head>
  <body>
    <div id="container">
      <h1>修改密码</h1>
      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %} {% if success %}
      <p class="success">{{ success }}</p>
      {% endif %}
      <form method="post">
        <div class="form-group">
          <label for="old_password">旧密码:</label>
          <input
            type="password"
            id="old_password"
            name="old_password"
            required
          />
        </div>
        <div class="form-group">
          <label for="new_password">新密码:</label>
          <input
            type="password"
            id="new_password"
            name="new_password"
            required
          />
        </div>
        <div class="form-group">
          <label for="confirm_password">确认新密码:</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required
          />
        </div>
        <button type="submit">确认修改密码</button>
      </form>
      <a href="{{ url_for('management') }}" class="back-link">返回主菜单</a>
    </div>
  </body>
</html>
